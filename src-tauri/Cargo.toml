[package]
name = "agent-stage"
version = "0.1.0"
description = "Multi-agent status stage — anime character board for agent attention"
authors = ["Gao JL"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agent_stage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
